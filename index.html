<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひらがなゲーム</title>
<style>
/* ===== Klee One：Google Fontsを使わず、自前配信 ===== */
@font-face {
  font-family: "Klee One";
  src: url("./fonts/KleeOne-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Klee One";
  src: url("./fonts/KleeOne-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}


:root{
  --bg:#f4f0e5;
  --panel:#fffdf8;
  --ink:#202020;
  --shadow:#c8c0ad;
  --yellow:#ffe38a;
  --jp-font:"Klee One","Yu Kyokasho","YuKyokasho",cursive;
  --ui-font:system-ui,-apple-system,"Noto Sans JP","Microsoft YaHei",sans-serif;
  --zh-font:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--ui-font);
}

/* ===== タイトル ===== */
.title-screen{
  min-height:100vh;
  height:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:28px;
  overflow-y:auto;
  padding:28px 20px 36px;
}
.title-screen h1{
  margin:8px 0 0;
  font-size:clamp(32px,6vw,56px);
  font-weight:900;
  text-align:center;
}
.title-stage-grid{
  width:min(740px,90vw);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  column-gap:22px;
  row-gap:30px;
  justify-content:center;
}
.title-stage-btn{
  width:100%;
  min-width:0;
  min-height:66px;
  border:3px solid var(--ink);
  background:#fff;
  border-radius:14px;
  padding:16px 12px;
  font-size:22px;
  font-weight:900;
  box-shadow:4px 4px 0 var(--shadow);
  cursor:pointer;
}
.title-stage-btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--shadow);
}
.title-stage-btn[data-stage="all"]{grid-column:auto}

.title-practice-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:3.1em;
  min-height:1.42em;
  margin:0 .10em;
  padding:.12em .30em .16em;
  border:1px solid #c8c8c8;
  border-bottom:3px solid #b5b5b5;
  border-radius:.34em;
  background:linear-gradient(#ffffff,#ececec);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),inset 0 -1px 0 rgba(0,0,0,.03),0 .08em .12em rgba(0,0,0,.11);
  line-height:1.05;
  vertical-align:.02em;
  cursor:pointer;
  user-select:none;
}
.title-practice-badge:active{
  border-bottom-width:1px;
  transform:translateY(.05em);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08),0 .02em .04em rgba(0,0,0,.08);
}

/* ===== 共通画面・操作ボタン ===== */
.game-screen{display:none}
.game-screen.active{display:block}
.wrap{
  width:min(900px,95vw);
  margin:0 auto;
  padding:18px 0 32px;
}
.game-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:72px;
}
.game-controls-left{display:flex;gap:10px}
.game-controls-right{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.home-btn{
  width:50px;
  height:50px;
  padding:0;
  border:3px solid var(--ink);
  background:#fff;
  color:#111;
  border-radius:12px;
  box-shadow:4px 4px 0 var(--shadow);
  cursor:pointer;
  display:grid;
  place-items:center;
}
.home-icon{width:31px;height:31px;display:block}
.home-btn:active,
.next-btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--shadow);
}
.next-btn{
  border:3px solid var(--ink);
  background:#fff;
  border-radius:12px;
  padding:10px 18px;
  min-height:48px;
  font-weight:900;
  font-size:18px;
  box-shadow:4px 4px 0 var(--shadow);
  cursor:pointer;
}
button,.title-practice-badge{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.game{
  background:var(--panel);
  border:4px solid var(--ink);
  border-radius:18px;
  box-shadow:7px 7px 0 var(--shadow);
  padding:18px;
  /* 最終防波堤：表示はゲーム枠の外へ出さない */
  overflow:hidden;
}
#playArea{max-width:100%}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.progress{font-weight:900;font-size:20px}

/* ===== 通常クイズ：位置指定をここだけに一本化 ===== */
.question{
  position:relative;
  display:grid;
  grid-template-columns:86px 330px;
  gap:18px;
  justify-content:center;
  align-items:start;
  max-width:100%;
  padding-bottom:58px; /* ローマ字の下に正誤表示の専用スペース */
}
.picture{
  width:86px;
  height:86px;
  margin:0;
  padding:3px;
  border:2px solid var(--ink);
  border-radius:10px;
  background:#eaf7ff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow:hidden;
}
.zh{
  width:100%;
  min-height:14px;
  margin-bottom:0;
  text-align:center;
  font-size:12px;
  font-weight:900;
  line-height:1.05;
  font-family:var(--zh-font)!important;
}
.emoji{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  line-height:1.15;
}
.answer{
  position:static; /* .result の基準を .question にする */
  width:330px;
  height:86px;
  min-height:86px;
  margin:0;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.slots{
  width:330px;
  min-height:0;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:7px;
}
.slot-unit{
  position:relative;
  display:block;
  width:58px;
  height:58px;
  flex:0 0 auto;
}
.slot{
  width:58px;
  height:58px;
  border:2.5px dashed #707070;
  border-radius:13px;
  background:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:900;
}
.slot.over{background:#fff1a8}
.slot-romaji{
  position:absolute;
  top:calc(100% + 5px);
  left:50%;
  transform:translateX(-50%);
  width:max-content;
  min-height:0;
  font-size:12px;
  font-weight:800;
  color:#555;
}
.result{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  height:34px;
  margin:0;
  padding:0;
  width:max-content;
  max-width:100%;
  text-align:center;
  white-space:nowrap;
  line-height:1.1;
  font-size:22px;
  font-weight:900;
}

/* ===== かなピース ===== */
.kana-board{
  margin-top:70px;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}
.kana-board.shuffled{
  position:relative;
  display:block;
  width:min(100%,620px);
  height:180px;
  margin:70px auto 0;
  overflow:hidden;
}
.kana-board.shuffled .kana-row{
  position:static;
  display:block;
}
.kana-board.shuffled .tile{
  position:absolute;
  margin:0;
  transform:none!important;
}
.kana-row{
  display:grid;
  grid-template-columns:repeat(5,58px);
  gap:7px;
}
.tile{
  width:58px;
  height:58px;
  border:1.5px solid var(--ink);
  border-radius:11px;
  background:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:900;
  box-shadow:2px 2px 0 var(--shadow);
  cursor:grab;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.tile:active,.kana-match-piece:active{cursor:grabbing}

/* や行・わ行の五十音位置 */
.kana-row[data-row="y"] .tile:nth-child(1),
.kana-row[data-row="w"] .tile:nth-child(1){grid-column:1}
.kana-row[data-row="y"] .tile:nth-child(2),
.kana-row[data-row="w"] .tile:nth-child(2){grid-column:3}
.kana-row[data-row="y"] .tile:nth-child(3),
.kana-row[data-row="w"] .tile:nth-child(3){grid-column:5}

/* ===== Pointer Events 共通ドラッグ表示 ===== */
.drag-source-hidden{
  opacity:0!important;
  pointer-events:none!important;
}
.__pointerDragGhost{
  position:fixed!important;
  z-index:99999!important;
  pointer-events:none!important;
  margin:0!important;
  transform:translate(-50%,-50%)!important;
  opacity:.96!important;
}

/* ===== 正誤アニメーション ===== */
@keyframes shakeCorrect{
  0%,100%{transform:translateX(0)}
  10%{transform:translateX(-4px)}
  20%{transform:translateX(4px)}
  30%{transform:translateX(-4px)}
  40%{transform:translateX(4px)}
  50%{transform:translateX(-3px)}
  60%{transform:translateX(3px)}
  70%{transform:translateX(-2px)}
  80%{transform:translateX(2px)}
  90%{transform:translateX(-1px)}
}
.slot.correct-shake{animation:shakeCorrect 1s linear}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  10%{transform:translateX(-5px)}
  20%{transform:translateX(5px)}
  30%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  50%{transform:translateX(-4px)}
  60%{transform:translateX(4px)}
  70%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
  90%{transform:translateX(-2px)}
}

/* ===== ひらがな／カタカナ マッチ ===== */
.kana-match{
  width:min(760px,100%);
  margin:0 auto;
  padding:8px 0 18px 6px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 135px;
  column-gap:12px;
  align-items:start;
  position:relative;
  text-align:center;
}
.kana-match-main{position:relative;min-width:0}
.kana-match-title{display:none}
.kana-match-grid{
  display:grid;
  grid-template-columns:repeat(5,58px);
  gap:10px;
  justify-content:center;
  align-items:center;
}
.kana-match-hira{
  height:58px;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:900;
}
.kana-match-slot{
  width:58px;
  height:58px;
  border:2.5px dashed #707070;
  border-radius:11px;
  background:#fff;
  display:grid;
  place-items:center;
  font-size:29px;
  font-weight:900;
}
.kana-match-slot.over{background:#fff1a8}
.kana-match-slot.wrong{animation:wrongShake .45s linear}
.kana-match-spacer{height:26px}
.kana-match-bank{
  display:grid;
  grid-template-columns:repeat(5,58px);
  gap:10px;
  justify-content:center;
  min-height:58px;
}
.kana-match-piece{
  width:58px;
  height:58px;
  border:1.5px solid var(--ink);
  border-radius:11px;
  background:#fff;
  box-shadow:2px 2px 0 var(--shadow);
  display:grid;
  place-items:center;
  font-size:29px;
  font-weight:900;
  cursor:grab;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.kana-match-piece.used{
  visibility:hidden;
  pointer-events:none;
}
.kana-match-empty{width:58px;height:58px}
.kana-match-status{
  position:static;
  align-self:start;
  width:135px;
  min-width:0;
  max-width:135px;
  min-height:0;
  margin:0;
  padding-top:18px;
  display:block;
  text-align:center;
  white-space:normal;
  line-height:1.15;
  font-size:20px;
  font-weight:900;
}
.kana-match-status span{
  display:inline-block;
  white-space:nowrap;
}
.progress:has(#qNum:empty):has(#qTotal:empty){font-size:0}

.hira-match-unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.hira-match-label{
  min-height:15px;
  font-size:12px;
  font-weight:800;
  color:#555;
  line-height:1;
}

/* ===== 合格画面 ===== */
.complete{
  position:relative;
  overflow:hidden;
  text-align:center;
  min-height:520px;
  padding:0;
}
.complete-content{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}
.complete-title{
  font-size:42px;
  font-weight:900;
  margin:26px 0 0;
}
.complete-date{
  position:absolute;
  right:18px;
  bottom:14px;
  font-size:18px;
  font-weight:800;
  margin:0;
  background:rgba(255,255,255,.55);
  padding:3px 7px;
  border-radius:6px;
}
.emoji-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}
.emoji-bg span{
  position:absolute;
  opacity:.08;
  user-select:none;
}
#signatureCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:transparent;
  touch-action:none;
  cursor:crosshair;
  z-index:3;
}

/* ===== フォント ===== */
.title-screen h1,
.title-practice-badge,
.title-stage-btn,
.next-btn,
#stageName,
.picture,
.answer,
.slot,
.result,
.tile,
.kana-match,
.kana-match-piece,
.kana-match-slot,
.complete-title{
  font-family:var(--jp-font)!important;
}
.slot-romaji,
.hira-match-label,
.kana-match-status,
.progress,
.complete-date{
  font-family:var(--ui-font)!important;
}
.zh{font-family:var(--zh-font)!important}

/* ===== レスポンシブ ===== */
@media(max-width:760px){
  .title-stage-grid{
    width:min(540px,90vw);
    grid-template-columns:repeat(3,minmax(0,1fr));
    column-gap:20px;
    row-gap:26px;
  }
  .title-stage-btn{
    min-height:62px;
    padding:15px 10px;
    font-size:21px;
  }
}

@media(max-width:650px){
  .game-controls{
    align-items:flex-start;
    margin-bottom:48px;
  }
  .game-controls-right{gap:7px}
  .next-btn{padding:9px 12px;font-size:16px}

  .question{
    grid-template-columns:68px minmax(0,275px);
    gap:12px;
    padding-bottom:54px;
  }
  .picture{
    width:68px;
    height:68px;
    padding:2px;
  }
  .zh{font-size:10px;min-height:12px}
  .emoji{font-size:33px}
  .answer{
    width:100%;
    max-width:275px;
    height:68px;
    min-height:68px;
  }
  .slots{width:100%;max-width:275px}
  .slot-unit{width:48px;height:48px}
  .slot{width:48px;height:48px;font-size:24px}
  .result{font-size:20px}

  .kana-board,
  .kana-board.shuffled{margin-top:58px}
  .kana-board.shuffled{height:160px}
  .kana-row{
    grid-template-columns:repeat(5,48px);
    gap:5px;
  }
  .tile{width:48px;height:48px;font-size:24px}

  .kana-match{
    width:100%;
    grid-template-columns:minmax(0,1fr) 105px;
    column-gap:8px;
  }
  .kana-match-grid,
  .kana-match-bank{
    grid-template-columns:repeat(5,48px);
    gap:6px;
  }
  .kana-match-hira,
  .kana-match-slot,
  .kana-match-piece,
  .kana-match-empty{
    width:48px;
    height:48px;
  }
  .kana-match-hira{font-size:25px}
  .kana-match-slot,.kana-match-piece{font-size:24px}
  .kana-match-status{
    width:105px;
    max-width:105px;
    padding-top:14px;
    font-size:17px;
  }
}

@media(max-width:500px){
  .title-screen{padding-top:18px;gap:18px}
  .title-stage-grid{
    width:88vw;
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:18px;
    row-gap:24px;
  }
  .title-stage-btn{
    min-height:60px;
    padding:14px 10px;
    font-size:20px;
  }
}

@media(max-width:390px){
  .kana-match{
    grid-template-columns:minmax(0,1fr) 80px;
    column-gap:6px;
  }
  .kana-match-grid,
  .kana-match-bank{
    grid-template-columns:repeat(5,38px);
    gap:4px;
  }
  .kana-match-hira,
  .kana-match-slot,
  .kana-match-piece,
  .kana-match-empty{
    width:38px;
    height:38px;
  }
  .kana-match-hira{font-size:21px}
  .kana-match-slot,.kana-match-piece{font-size:20px}
  .kana-match-status{
    width:80px;
    max-width:80px;
    padding-top:10px;
    font-size:15px;
  }

  .question{
    grid-template-columns:60px minmax(0,1fr);
    gap:8px;
    padding-bottom:52px;
  }
  .picture{width:60px;height:60px}
  .emoji{font-size:29px}
  .answer{height:60px;min-height:60px}
  .slots{gap:5px}
  .slot-unit{width:42px;height:42px}
  .slot{width:42px;height:42px;font-size:22px}
  .slot-romaji{font-size:11px}
  .kana-row{grid-template-columns:repeat(5,44px);gap:4px}
  .tile{width:44px;height:44px;font-size:22px}
  .kana-board.shuffled{height:150px}
}

@media(max-width:340px){
  .kana-match{
    grid-template-columns:minmax(0,1fr) 72px;
    column-gap:6px;
  }
  .kana-match-grid,
  .kana-match-bank{
    grid-template-columns:repeat(5,32px);
    gap:3px;
  }
  .kana-match-hira,
  .kana-match-slot,
  .kana-match-piece,
  .kana-match-empty{
    width:32px;
    height:32px;
  }
  .kana-match-hira{font-size:18px}
  .kana-match-slot,.kana-match-piece{font-size:17px}
  .kana-match-status{
    width:72px;
    max-width:72px;
    padding-top:8px;
    font-size:13px;
  }
}

@media(pointer:coarse){
  .tile,.kana-match-piece{position:relative}
  .kana-board.shuffled .tile{position:absolute}
  .tile::before,.kana-match-piece::before{
    content:"";
    position:absolute;
    inset:-8px;
  }
}



/* ===== トップ画面：シンプルでかわいいデザイン ===== */
.title-screen{
  min-height:100svh;
  height:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-y:auto;
  padding:30px 18px;
  background:
    radial-gradient(circle at 10% 12%, rgba(255,227,138,.42) 0 72px, transparent 73px),
    radial-gradient(circle at 90% 86%, rgba(186,226,255,.42) 0 88px, transparent 89px),
    var(--bg);
}

.title-card{
  position:relative;
  width:min(780px,94vw);
  padding:30px 30px 34px;
  border:3px solid var(--ink);
  border-radius:28px;
  background:rgba(255,253,248,.96);
  box-shadow:8px 8px 0 var(--shadow);
  overflow:hidden;
}

.title-heading{
  position:relative;
  z-index:2;
  text-align:center;
}

.title-kicker{
  margin-bottom:5px;
  font-family:var(--ui-font);
  font-size:12px;
  font-weight:900;
  letter-spacing:.18em;
  color:#777064;
}

.title-screen h1{
  margin:0;
  font-size:clamp(38px,6vw,58px);
  line-height:1.05;
  font-weight:600;
  letter-spacing:.04em;
}

.title-sub{
  margin:9px 0 0;
  font-family:var(--jp-font);
  font-size:16px;
  font-weight:600;
  color:#6f695f;
}

.title-deco{
  position:absolute;
  z-index:1;
  width:56px;
  height:56px;
  border:2px solid rgba(32,32,32,.18);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-family:var(--jp-font);
  font-size:27px;
  font-weight:600;
  user-select:none;
  pointer-events:none;
}

.title-deco-1{
  left:25px;
  top:24px;
  background:#fff0b8;
  transform:rotate(-8deg);
}

.title-deco-2{
  right:25px;
  top:24px;
  background:#dff2ff;
  transform:rotate(8deg);
}

.title-switch-row{

function toKatakana(str){
  return [...str].map(ch=>{
    const code=ch.charCodeAt(0);
    return (code>=0x3041 && code<=0x3096)
      ? String.fromCharCode(code+0x60)
      : ch;
  }).join("");
}

function displayKana(str){
  return kanaScriptMode==="katakana" ? toKatakana(str) : str;
}

function kanaWordToRomaji(str){
  const toHira = ch=>{
    const code=ch.charCodeAt(0);
    return (code>=0x30A1 && code<=0x30F6)
      ? String.fromCharCode(code-0x60)
      : ch;
  };

  let out="";
  let geminate=false;
  const chars=[...str];

  for(let i=0;i<chars.length;i++){
    let ch=toHira(chars[i]);

    if(ch==="っ"){
      geminate=true;
      continue;
    }

    if(ch==="ー"){
      const last=out.match(/[aeiou](?!.*[aeiou])/);
      if(last) out+=last[0];
      continue;
    }

    let r=ROMAJI[ch] || ch;

    if(geminate && /^[a-z]/i.test(r)){
      r=r[0]+r;
      geminate=false;
    }
    out+=r;
  }
  return out;
}

  "あ":"a","い":"i","う":"u","え":"e","お":"o",
  "か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
  "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",

function wordRomaji(word){

function normalizeKanaString(str){
  return [...str].map(ch=>{
    const code=ch.charCodeAt(0);
    // カタカナ → ひらがな
    if(code>=0x30A1 && code<=0x30F6){
      return String.fromCharCode(code-0x60);
    }
    return ch;
  }).join("");
}

function charToRomaji(ch){
  const code=ch.charCodeAt(0);
  const hira=(code>=0x30A1 && code<=0x30F6)
    ? String.fromCharCode(code-0x60)
    : ch;

  const extra={
    "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",
    "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",
    "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",
    "ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
    "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",
    "ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o",
    "ゃ":"ya","ゅ":"yu","ょ":"yo",
    "っ":"tsu",
    "ゔ":"vu",
    "ー":"-"
  };

  return ROMAJI[hira] || extra[hira] || hira;
}

function stage(){return kanaScriptMode==="katakana" ? KATAKANA_STAGES[stageKey] || STAGES[stageKey] : STAGES[stageKey]}

function shuffledCopy(arr){
  const out=[...arr];
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

function buildQuestionSet(){
  const s=stage();
  if(!s || !Array.isArray(s.questions)) return [];

  const all=[...s.questions];

  // 合計10問以下なら全部出題
  if(all.length<=10){
    return shuffledCopy(all);
  }

  // baseCountまでを「その行」、残りを「ミックス」とする
  const baseCount=Math.max(0,Math.min(Number(s.baseCount)||0,all.length));
  const rowPool=shuffledCopy(all.slice(0,baseCount));
  const mixPool=shuffledCopy(all.slice(baseCount));

  const picked=[];

  // まず「その行」を最大5問（足りなければある分だけ）
  const rowFirst=rowPool.splice(0,Math.min(5,rowPool.length));
  picked.push(...rowFirst);

  // その行が終わってからミックスを最大5問
  const mixNext=mixPool.splice(0,Math.min(5,mixPool.length));
  picked.push(...mixNext);

  // 合計10問に足りない場合は、残っている問題で補う
  // 順番は「その行の残り」→「ミックスの残り」
  let need=10-picked.length;

  if(need>0 && rowPool.length>0){
    const extraRow=rowPool.splice(0,need);
    picked.push(...extraRow);
    need=10-picked.length;
  }

  if(need>0 && mixPool.length>0){
    const extraMix=mixPool.splice(0,need);
    picked.push(...extraMix);
  }

  // グループ内はランダムだが、順番は「その行」→「ミックス」を維持
  return picked.slice(0,10);
}

function visibleRows(){
  if(stageKey==="test") return ["a"];

  const order=["a","k","s","t","n","h","m","y","r","w"];

  // 問題の文字をひらがなに正規化
  const answerChars=[...question().w].map(ch=>{
    const code=ch.charCodeAt(0);
    return (code>=0x30A1 && code<=0x30F6)
      ? String.fromCharCode(code-0x60)
      : ch;
  });

  // 練習モードでは、答えに必要な文字を含む行だけ表示
  const modeBtn=document.getElementById("titleModeButton");
  const isPractice = !modeBtn || modeBtn.textContent.trim()==="練習";

  if(isPractice){
    if(kanaScriptMode==="katakana" && ROWS[stageKey]){
      return [stageKey];
    }

    return order.filter(rowKey=>{
      const rowSet=new Set(ROWS[rowKey] || []);
      return answerChars.some(ch=>rowSet.has(ch));
    });
  }

  // 練習以外は従来どおり
  const currentRow=new Set(ROWS[stageKey] || []);
  if(answerChars.every(ch=>currentRow.has(ch))){
    return [stageKey];
  }

  const stageIndex=order.indexOf(stageKey);

  if(stageIndex>=order.indexOf("m")){
    return order.filter(rowKey=>{
      const rowSet=new Set(ROWS[rowKey] || []);
      return answerChars.some(ch=>rowSet.has(ch));
    });
  }

  return order.slice(0,stageIndex+1);
}

function bindPointerDrag({
  element,
  dropSelector,
  onDrop,
  onTap=null,
  canStart=()=>true
}){
  let active=false;
  let dragging=false;
  let pointerId=null;
  let startX=0;
  let startY=0;
  let ghost=null;

  const clearOver=()=>{
    document.querySelectorAll(`${dropSelector}.over`).forEach(el=>el.classList.remove("over"));
  };

  const cleanup=()=>{
    clearOver();
    element.classList.remove("drag-source-hidden");
    if(ghost){
      ghost.remove();
      ghost=null;
    }
    if(pointerId!==null){
      try{ element.releasePointerCapture(pointerId); }catch(_){}
    }
    active=false;
    dragging=false;
    pointerId=null;
  };

  const targetAt=(x,y)=>{
    const under=document.elementFromPoint(x,y);
    return under?.closest?.(dropSelector) || null;
  };

  element.draggable=false;
  element.addEventListener("pointerdown",e=>{
    if(!canStart()) return;
    if(e.pointerType==="mouse" && e.button!==0) return;

    active=true;
    dragging=false;
    pointerId=e.pointerId;
    startX=e.clientX;
    startY=e.clientY;
    try{ element.setPointerCapture(e.pointerId); }catch(_){}
  });

  element.addEventListener("pointermove",e=>{
    if(!active || e.pointerId!==pointerId || !canStart()) return;

    const dist=Math.hypot(e.clientX-startX,e.clientY-startY);
    if(!dragging && dist>10){
      dragging=true;
      const rect=element.getBoundingClientRect();
      ghost=element.cloneNode(true);
      ghost.classList.remove("drag-source-hidden");
      ghost.classList.add("__pointerDragGhost");
      ghost.style.width=`${rect.width}px`;
      ghost.style.height=`${rect.height}px`;
      ghost.style.left=`${e.clientX}px`;
      ghost.style.top=`${e.clientY}px`;
      document.body.appendChild(ghost);
      element.classList.add("drag-source-hidden");
    }

    if(!dragging) return;
    e.preventDefault();
    if(ghost){
      ghost.style.left=`${e.clientX}px`;
      ghost.style.top=`${e.clientY}px`;
    }
    clearOver();
    const target=targetAt(e.clientX,e.clientY);
    if(target) target.classList.add("over");
  },{passive:false});

  element.addEventListener("pointerup",e=>{
    if(!active || e.pointerId!==pointerId) return;

    if(dragging){
      e.preventDefault();
      e.stopPropagation();
      if(ghost) ghost.style.display="none";
      const target=targetAt(e.clientX,e.clientY);
      cleanup();
      if(target && canStart()) onDrop(target);
      return;
    }

    cleanup();
    if(onTap && canStart()) onTap();
  });

  element.addEventListener("pointercancel",cleanup);
}

function renderBoard(){
  boardEl.innerHTML="";
  boardEl.classList.toggle("shuffled", shuffleMode);

  const makeTile=(k,parent)=>{
    const tile=document.createElement("div");
    tile.className="tile";
    tile.textContent=displayKana(k);
    tile.dataset.kana=k;

    const placeKanaByTap=()=>{
      if(locked) return;
      const empty=[...document.querySelectorAll(".slot")].find(s=>!s.dataset.kanaValue);
      if(!empty) return;
      setSlotKana(empty,k);
      checkAnswer();
    };

    bindPointerDrag({
      element:tile,
      dropSelector:".slot",
      canStart:()=>!locked,
      onTap:placeKanaByTap,
      onDrop:slot=>{
        if(locked || slot.dataset.prefilled==="1") return;
        setSlotKana(slot,k);
        checkAnswer();
      }
    });

    parent.appendChild(tile);
  };

  if(shuffleMode){
    // 全行から候補を作る。答え文字は必ず含める。
    const allKana = Object.values(ROWS).flat();

    // 答えは出現回数を維持（例：「いい」なら「い」を2個）。
    const answerChars = [...question().w];
    const answerCounts = {};
    answerChars.forEach(k=>answerCounts[k]=(answerCounts[k]||0)+1);

    // 追加候補は答えに含まれる文字を除外し、重複なし。
    let extras = [...new Set(allKana.filter(k=>!answerCounts[k]))];

    for(let i=extras.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [extras[i],extras[j]]=[extras[j],extras[i]];
    }

    let pool=[...answerChars];
    pool.push(...extras.slice(0, Math.max(0,8-pool.length)));

    // 念のため10個未満なら、まだ使っていない文字から補充。
    if(pool.length<8){
      const used=new Set(pool);
      const rest=[...new Set(allKana)].filter(k=>!used.has(k));
      for(let i=rest.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [rest[i],rest[j]]=[rest[j],rest[i]];
      }
      pool.push(...rest.slice(0,8-pool.length));
    }

    // 配置順もランダム
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }

    const row=document.createElement("div");
    row.className="kana-row";
    pool.slice(0,8).forEach(k=>makeTile(k,row));
    boardEl.appendChild(row);

    // テストモード：4個×2段で、枠内・非重複・ほどよい間隔に固定。
    requestAnimationFrame(()=>{
      const tiles=[...boardEl.querySelectorAll(".tile")];
      const boardRect=boardEl.getBoundingClientRect();
      const tileSize = tiles[0] ? tiles[0].getBoundingClientRect().width : 58;

      const cols=4;
      const rows=2;
      const padX=16;
      const padY=12;

      const usableW=boardRect.width - padX*2;
      const usableH=boardRect.height - padY*2;
      const cellW=usableW/cols;
      const cellH=usableH/rows;

      const jitterPatterns=[
        [0,5,-4,3,-3,4,5,-2],
        [4,-3,3,-4,2,5,-3,3],
        [-3,4,0,5,4,-4,2,-2]
      ];
      const pattern=jitterPatterns[Math.floor(Math.random()*jitterPatterns.length)];

      tiles.forEach((tile,i)=>{
        const col=i%cols;
        const row=Math.floor(i/cols);

        let x=padX + col*cellW + (cellW-tileSize)/2;
        let y=padY + row*cellH + (cellH-tileSize)/2 + pattern[i];

        x=Math.max(0, Math.min(boardRect.width-tileSize, x));
        y=Math.max(0, Math.min(boardRect.height-tileSize, y));

        tile.style.left=`${x}px`;
        tile.style.top=`${y}px`;
        tile.style.transform="none";
      });
    });

    return;
  }

  visibleRows().forEach(rowKey=>{
    const row=document.createElement("div");
    row.className="kana-row";
    row.dataset.row=rowKey;
    ROWS[rowKey].forEach(k=>makeTile(k,row));
    boardEl.appendChild(row);
  });

  const visibleKana = new Set(visibleRows().flatMap(r=>ROWS[r]));

  // カタカナ問題でも、基本カタカナは対応するひらがな行のピースを使う。
  // 「ー」「ガ」など、基本の行にない文字だけを追加ピースとして出す。
  const toHiraganaForBoard = ch=>{
    const code=ch.charCodeAt(0);
    return (code>=0x30A1 && code<=0x30F6)
      ? String.fromCharCode(code-0x60)
      : ch;
  };

  let extras = [...question().w].filter(k=>{
    if(kanaScriptMode==="katakana" && isPracticeMode()){
      return false;
    }
    const normalized = toHiraganaForBoard(k);
    return !visibleKana.has(normalized);
  });

  // 同じ追加文字は1個にし、答え順のヒントにならないよう毎回シャッフルする。
  extras = [...new Set(extras)];
  for(let i=extras.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [extras[i],extras[j]]=[extras[j],extras[i]];
  }

  if(extras.length){
    const extraRow=document.createElement("div");
    extraRow.className="kana-row extra-kana-row";
    extras.forEach(k=>makeTile(k,extraRow));
    boardEl.appendChild(extraRow);
  }
}

function checkAnswer(){
  const slots=[...document.querySelectorAll(".slot")];
  if(slots.some(s=>!s.textContent))return;

  const made=normalizeKanaString(
    slots.map(s=>s.dataset.kanaValue || s.textContent).join("")
  );

  const targetWord=normalizeKanaString(question().w);

  if(made===targetWord){
    locked=true;
    correctSet.add(qIndex);
    resultEl.textContent="○ せいかい！";
    setTimeout(()=>{
      goNext();
    },280);
  }else{
    locked=true;
    resultEl.textContent="× もういちど";

    const answerChars=[...normalizeKanaString(question().w)];

    // 間違っている位置だけ1秒振動
    slots.forEach((s,i)=>{
      const current=normalizeKanaString(s.dataset.kanaValue || s.textContent || "");
      if(current!==answerChars[i]){
        s.classList.add("correct-shake");
      }
    });

    // 1秒後、学生が入れた枠だけリセット。入力済み枠は残す。
    setTimeout(()=>{
      slots.forEach(s=>{
        s.classList.remove("correct-shake");
        if(s.dataset.prefilled!=="1"){
          clearSlotKana(s);
        }
      });
      resultEl.textContent="";
      locked=false;
    },1000);
  }
}

function initSignatureCanvas(){
  const canvas=document.getElementById("signatureCanvas");
  const area=document.getElementById("completeArea");
  if(!canvas || !area)return;

  const resizeCanvas=()=>{
    const r=area.getBoundingClientRect();
    const dpr=window.devicePixelRatio || 1;
    canvas.width=Math.max(1,Math.round(r.width*dpr));
    canvas.height=Math.max(1,Math.round(r.height*dpr));
    const c=canvas.getContext("2d");
    c.setTransform(dpr,0,0,dpr,0,0);
    c.lineWidth=5;
    c.lineCap="round";
    c.lineJoin="round";
    c.strokeStyle="#111";
  };

  resizeCanvas();

  const c=canvas.getContext("2d");
  c.lineWidth=5;
  c.lineCap="round";
  c.lineJoin="round";
  c.strokeStyle="#111";

  let drawing=false;

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left;
    const y=e.clientY-r.top;
    return {x,y};
  };

  canvas.addEventListener("pointerdown",e=>{
    drawing=true;
    canvas.setPointerCapture(e.pointerId);
    const p=point(e);
    c.beginPath();
    c.moveTo(p.x,p.y);
  });

  canvas.addEventListener("pointermove",e=>{
    if(!drawing)return;
    const p=point(e);
    c.lineTo(p.x,p.y);
    c.stroke();
  });

  const stop=e=>{
    drawing=false;
    try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
  };

  canvas.addEventListener("pointerup",stop);
  canvas.addEventListener("pointercancel",stop);
  canvas.addEventListener("pointerleave",e=>{
    if(e.buttons===0)drawing=false;
  });
}

function matchRowForStage(key){
  // 五十音の実在文字だけを使う。
  // や行・わ行は存在しない仮名を作らず、空欄で位置を保つ。
  const layouts={
    a:["あ","い","う","え","お"],
    k:["か","き","く","け","こ"],
    s:["さ","し","す","せ","そ"],
    t:["た","ち","つ","て","と"],
    n:["な","に","ぬ","ね","の"],
    h:["は","ひ","ふ","へ","ほ"],
    m:["ま","み","む","め","も"],
    y:["や",null,"ゆ",null,"よ"],
    r:["ら","り","る","れ","ろ"],
    w:["わ",null,"を",null,"ん"]
  };
  return layouts[key] || [];
}

  // --------------------------------------------------

  if(hiraganaMatchPhase===1){
    const shuffled=[...actual];
    for(let i=shuffled.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }

    playArea.innerHTML=`
      <div class="kana-match">

          <div class="kana-match-grid">
            ${layout.map(ch=>ch
              ? `<div class="hira-match-unit">
                   <div class="kana-match-slot" data-answer="${ch}"></div>
                   <div class="hira-match-label">${hiraCharToRomaji(ch)}</div>
                 </div>`
              : `<div class="kana-match-empty"></div>`
            ).join("")}
          </div>

          <div class="kana-match-spacer"></div>

          <div class="kana-match-bank">
            ${shuffled.map(ch=>{
              return `<div class="kana-match-piece" data-kana="${ch}">${ch}</div>`;
            }).join("")}
          </div>
        </div>

        <div class="kana-match-status" id="kanaMatchStatus"></div>
      </div>
    `;

    let completed=0;
    const slots=[...playArea.querySelectorAll(".kana-match-slot")];
    const pieces=[...playArea.querySelectorAll(".kana-match-piece")];
    const statusEl=playArea.querySelector("#kanaMatchStatus");

    const finishOne=(slot,piece)=>{
      if(slot.dataset.done==="1" || piece.classList.contains("used")) return;

      if(piece.dataset.kana===slot.dataset.answer){
        slot.textContent=piece.dataset.kana;
        slot.dataset.done="1";
        piece.classList.add("used");
        completed++;

        if(completed===actual.length){
          if(statusEl) statusEl.innerHTML="<span>OK！</span>";
          setTimeout(()=>{
            hiraganaMatchPhase=2;
            hiraganaStepIndex=0;
            hiraganaStepRound=0;
            hiraganaStepSolved=[];
            hiraganaStepOrder=[...actual];

            for(let i=hiraganaStepOrder.length-1;i>0;i--){
              const j=Math.floor(Math.random()*(i+1));
              [hiraganaStepOrder[i],hiraganaStepOrder[j]]=[hiraganaStepOrder[j],hiraganaStepOrder[i]];
            }

            renderHiraganaMatch();
          },500);
        }
      }else{
        slot.classList.remove("wrong");
        void slot.offsetWidth;
        slot.classList.add("wrong");
        setTimeout(()=>slot.classList.remove("wrong"),460);
      }
    };

    setupMatchInput(pieces,slots,finishOne);
    return;
  }

  // --------------------------------------------------
  // 2回目：段階式マッチを2周
  // --------------------------------------------------
  const current=validSteps[hiraganaStepIndex];

  if(!current){
    hiraganaStepRound++;

    // 1周目終了 → 行全体成功時だけ「OK！ もういちど！」
    if(hiraganaStepRound<2){
      const statusEl=playArea.querySelector("#kanaMatchStatus");
      if(statusEl) statusEl.innerHTML="<span>OK！</span><br><span>もういちど！</span>";

      setTimeout(()=>{
        hiraganaStepIndex=0;
        hiraganaStepSolved=[];
        hiraganaStepOrder=[...actual];

        for(let i=hiraganaStepOrder.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [hiraganaStepOrder[i],hiraganaStepOrder[j]]=[hiraganaStepOrder[j],hiraganaStepOrder[i]];
        }

        renderHiraganaMatch();
      },700);
      return;
    }

    // 2周成功 → 行全体成功時だけ「OK！」
    const statusEl=playArea.querySelector("#kanaMatchStatus");
    if(statusEl) statusEl.innerHTML="<span>OK！</span>";

    setTimeout(()=>{
      hiraganaMatchPhase=1;
      hiraganaStepIndex=0;
      hiraganaStepRound=0;
      hiraganaStepOrder=[];
      hiraganaStepSolved=[];
      startQuizAfterMatch();
    },600);
    return;
  }

  const targetHira=current.ch;

  playArea.innerHTML=`
    <div class="kana-match">
      <div class="kana-match-main">
        <div class="kana-match-grid">
          ${layout.map((ch,index)=>{
            if(!ch) return `<div class="kana-match-empty"></div>`;

            const solved=hiraganaStepSolved.includes(ch);

            if(solved){
              return `<div class="hira-match-unit">
                        <div class="kana-match-slot" data-answer="${ch}" data-done="1">${ch}</div>
                        <div class="hira-match-label">${hiraCharToRomaji(ch)}</div>
                      </div>`;
            }

            if(index===current.index){
              return `<div class="hira-match-unit">
                        <div class="kana-match-slot" data-answer="${ch}"></div>
                        <div class="hira-match-label">${hiraCharToRomaji(ch)}</div>
                      </div>`;
            }

            return `<div class="kana-match-empty"></div>`;
          }).join("")}
        </div>

        <div class="kana-match-spacer"></div>

        <div class="kana-match-bank">
          ${hiraganaStepOrder.map(ch=>{
            const used=hiraganaStepSolved.includes(ch);
            return `<div class="kana-match-piece${used ? " used" : ""}" data-kana="${ch}">${ch}</div>`;
          }).join("")}
        </div>
      </div>

      <div class="kana-match-status" id="kanaMatchStatus"></div>
    </div>
  `;

  const slot=playArea.querySelector('.kana-match-slot:not([data-done="1"])');
  const slots=slot ? [slot] : [];
  const pieces=[...playArea.querySelectorAll(".kana-match-piece")];
  const statusEl=playArea.querySelector("#kanaMatchStatus");

  const finishOne=(targetSlot,piece)=>{
    if(!targetSlot || targetSlot.dataset.done==="1") return;

    if(piece.dataset.kana===targetHira){
      targetSlot.textContent=piece.dataset.kana;
      targetSlot.dataset.done="1";
      piece.classList.add("used");

      if(!hiraganaStepSolved.includes(piece.dataset.kana)){
        hiraganaStepSolved.push(piece.dataset.kana);
      }

      hiraganaStepIndex++;

      setTimeout(()=>{
        renderHiraganaMatch();
      },180);

    }else{
      targetSlot.classList.remove("wrong");
      void targetSlot.offsetWidth;
      targetSlot.classList.add("wrong");

      if(statusEl) statusEl.innerHTML="<span>もういちど！</span>";

      // 失敗したら、その周の最初から。並びもシャッフルし直す
      setTimeout(()=>{
        hiraganaStepIndex=0;
        hiraganaStepSolved=[];
        hiraganaStepOrder=[...actual];

        for(let i=hiraganaStepOrder.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [hiraganaStepOrder[i],hiraganaStepOrder[j]]=[hiraganaStepOrder[j],hiraganaStepOrder[i]];
        }

        renderHiraganaMatch();
      },650);
    }
  };

  setupMatchInput(pieces,slots,finishOne);
}

function renderKatakanaMatch(){
  setMatchNavigationHidden(true);

  const playArea=document.getElementById("playArea");
  const layout=matchRowForStage(stageKey);
  const actual=layout.filter(Boolean);

  stageNameEl.textContent=(KATAKANA_STAGES[stageKey]?.name || stage().name);
  qNumEl.textContent="";
  qTotalEl.textContent="";

  // -----------------------------
  // フェーズ1：通常の5文字マッチ
  // -----------------------------
  if(katakanaMatchPhase===1){
    const shuffled=[...actual];
    for(let i=shuffled.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }

    playArea.innerHTML=`
      <div class="kana-match">
        <div class="kana-match-main">
          <div class="kana-match-grid" id="kanaMatchTop">
            ${layout.map(ch=>ch
              ? `<div class="kana-match-hira">${ch}</div>`
              : `<div class="kana-match-empty"></div>`
            ).join("")}

            ${layout.map(ch=>ch
              ? `<div class="kana-match-slot" data-answer="${toKatakana(ch)}"></div>`
              : `<div class="kana-match-empty"></div>`
            ).join("")}
          </div>

          <div class="kana-match-spacer"></div>

          <div class="kana-match-bank" id="kanaMatchBank">
            ${shuffled.map(ch=>`<div class="kana-match-piece" data-kana="${toKatakana(ch)}">${toKatakana(ch)}</div>`).join("")}
          </div>
        </div>

        <div class="kana-match-status" id="kanaMatchStatus"></div>
      </div>
    `;

    let completed=0;
    const slots=[...playArea.querySelectorAll(".kana-match-slot")];
    const pieces=[...playArea.querySelectorAll(".kana-match-piece")];
    const statusEl=playArea.querySelector("#kanaMatchStatus");

    const finishOne=(slot,piece)=>{
      if(slot.dataset.done==="1" || piece.classList.contains("used")) return;

      if(piece.dataset.kana===slot.dataset.answer){
        slot.textContent=piece.dataset.kana;
        slot.dataset.done="1";
        piece.classList.add("used");
        completed++;

        if(completed===actual.length){
          if(statusEl) statusEl.innerHTML="<span>OK！</span>";
          setTimeout(()=>{
            katakanaMatchPhase=2;
            katakanaStepIndex=0;
            katakanaStepSolved=[];

            // 2回目は最初に1回だけ並べ替え、その後は順序を固定
            katakanaStepOrder=[...actual];
            for(let i=katakanaStepOrder.length-1;i>0;i--){
              const j=Math.floor(Math.random()*(i+1));
              [katakanaStepOrder[i],katakanaStepOrder[j]]=[katakanaStepOrder[j],katakanaStepOrder[i]];
            }

            renderKatakanaMatch();
          },650);
        }
      }else{
        slot.classList.remove("wrong");
        void slot.offsetWidth;
        slot.classList.add("wrong");
        setTimeout(()=>slot.classList.remove("wrong"),460);
      }
    };

    setupMatchInput(pieces,slots,finishOne);
    return;
  }

  // -----------------------------
  // フェーズ2：段ごとに1つずつ選ぶ
  // a → i → u → e → o
  // 失敗したら a からやり直し
  // -----------------------------
  const validSteps=layout
    .map((ch,index)=>({ch,index}))
    .filter(x=>x.ch);

  // や行・わ行のように文字が3つしかない行は、存在する段だけ順に進める
  const current=validSteps[katakanaStepIndex];
  if(!current){
    startQuizAfterMatch();
    return;
  }

  const targetHira=current.ch;
  const targetKata=toKatakana(targetHira);

  // フェーズ2では最初に決めた並び順を維持
  const shuffled=[...katakanaStepOrder];

  playArea.innerHTML=`
    <div class="kana-match">
      <div class="kana-match-main">
        <div class="kana-match-grid" id="kanaMatchTop">
          ${layout.map((ch,index)=>{
            if(!ch) return `<div class="kana-match-empty"></div>`;
            return `<div class="kana-match-hira">${ch}</div>`;
          }).join("")}

          ${layout.map((ch,index)=>{
            if(!ch) return `<div class="kana-match-empty"></div>`;

            const kata=toKatakana(ch);
            const solved=katakanaStepSolved.includes(kata);

            if(solved){
              return `<div class="kana-match-slot" data-answer="${kata}" data-done="1">${kata}</div>`;
            }

            if(index===current.index){
              return `<div class="kana-match-slot" data-answer="${kata}"></div>`;
            }

            return `<div class="kana-match-empty"></div>`;
          }).join("")}
        </div>

        <div class="kana-match-spacer"></div>

        <div class="kana-match-bank" id="kanaMatchBank">
          ${shuffled.map(ch=>{
            const kata=toKatakana(ch);
            const used=katakanaStepSolved.includes(kata);
            return `<div class="kana-match-piece${used ? " used" : ""}" data-kana="${kata}">${kata}</div>`;
          }).join("")}
        </div>
      </div>

      <div class="kana-match-status" id="kanaMatchStatus"></div>
    </div>
  `;

  // 正解済みの枠ではなく、現在の未回答枠だけを取得する
  const slot=playArea.querySelector('.kana-match-slot:not([data-done="1"])');
  const slots=slot ? [slot] : [];
  const pieces=[...playArea.querySelectorAll(".kana-match-piece")];
  const statusEl=playArea.querySelector("#kanaMatchStatus");

  const finishOne=(targetSlot,piece)=>{
    if(!targetSlot || targetSlot.dataset.done==="1") return;

    if(piece.dataset.kana===targetKata){
      targetSlot.textContent=piece.dataset.kana;
      targetSlot.dataset.done="1";
      piece.classList.add("used");

      if(!katakanaStepSolved.includes(piece.dataset.kana)){
        katakanaStepSolved.push(piece.dataset.kana);
      }

      // 1文字ごとにはOKを出さない
      katakanaStepIndex += 1;

      setTimeout(()=>{
        if(katakanaStepIndex >= validSteps.length){
          if(statusEl) statusEl.innerHTML="<span>OK！</span>";

          setTimeout(()=>{
            katakanaMatchPhase=1;
            katakanaStepIndex=0;
            katakanaStepOrder=[];
            katakanaStepSolved=[];
            startQuizAfterMatch();
          },550);
        }else{
          renderKatakanaMatch();
        }
      },180);
    }else{
      // 失敗したら a 段からやり直し
      targetSlot.classList.remove("wrong");
      void targetSlot.offsetWidth;
      targetSlot.classList.add("wrong");

      if(statusEl) statusEl.innerHTML="<span>もういちど！</span>";

      setTimeout(()=>{
        katakanaStepIndex=0;
        katakanaStepSolved=[];

        // やり直し時は、その行のピースをシャッフルし直す
        katakanaStepOrder=[...actual];
        for(let i=katakanaStepOrder.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [katakanaStepOrder[i],katakanaStepOrder[j]]=[katakanaStepOrder[j],katakanaStepOrder[i]];
        }

        renderKatakanaMatch();
      },650);
    }
  };

  setupMatchInput(pieces,slots,finishOne);
}

// マッチゲーム共通：クリック／タップ／ドラッグを Pointer Events で統一
function setupMatchInput(pieces,slots,finishOne){
  pieces.forEach(piece=>{
    const putIntoCurrentSlot=()=>{
      if(piece.classList.contains("used")) return;

      // まだ正解していない一番左（段階式では現在）の枠へ入れる
      const slot=slots.find(s=>s.dataset.done!=="1");
      if(!slot) return;

      finishOne(slot,piece);
    };

    bindPointerDrag({
      element:piece,
      dropSelector:".kana-match-slot",
      canStart:()=>!piece.classList.contains("used"),

      // クリック／タップ
      onTap:putIntoCurrentSlot,

      // ドラッグ
      onDrop:slot=>{
        if(slot.dataset.done==="1") return;
        finishOne(slot,piece);
      }
    });
  });
}

function switchStage(key){
  setMatchNavigationHidden(false);
  stageKey=key;
  qIndex=0;
  locked=false;
  prepareQuestionSet();

  if(!document.getElementById("slots"))restorePlayArea();
  renderQuestion();
}


function goNext(){
  if(reviewing){
    if(reviewQueue.length){
      qIndex=reviewQueue.shift();
      renderQuestion();
    }else{
      if(correctSet.size===activeQuestions().length){
        showPass();
      }else{
        startReviewRound();
      }
    }
    return;
  }

  if(qIndex<activeQuestions().length-1){
    qIndex++;
    renderQuestion();
  }else{
    if(correctSet.size===activeQuestions().length){
      showPass();
    }else{
      startReviewRound();
    }
  }
}


function bindTap(el,handler){
  if(!el) return;
  let pointerHandled=false;

  el.addEventListener("pointerup",e=>{
    if(e.pointerType==="touch" || e.pointerType==="pen"){
      e.preventDefault();
      pointerHandled=true;
      handler(e);
      setTimeout(()=>{pointerHandled=false},350);
    }
  });

  el.addEventListener("click",e=>{
    if(pointerHandled){
      e.preventDefault();
      return;
    }
    handler(e);
  });
}

const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");

function startStage(key){
  const modeBtn=document.getElementById("titleModeButton");
  const isTest = modeBtn && modeBtn.textContent.trim()==="テスト";

  // 練習＝通常配置、テスト＝同じステージのばらばら配置
  shuffleMode = !!isTest;

  correctSet=new Set();
  reviewQueue=[];
  reviewing=false;
  selectedQuestions=[];

  titleScreen.style.display="none";
  gameScreen.classList.add("active");

  stageKey=key;
  qIndex=0;
  locked=false;

  if(key==="all" && kanaScriptMode==="katakana"){
    katakanaAllMode=true;
    katakanaAllStageIndex=0;
    katakanaStepIndex=0;
    katakanaStepOrder=[];
    katakanaStepSolved=[];
    if(!document.getElementById("slots")) restorePlayArea();
    renderKatakanaAllStep();
    return;
  }

  if(key==="all" && kanaScriptMode==="hiragana"){
    hiraganaAllMode=true;
    hiraganaAllStageIndex=0;
    hiraganaStepIndex=0;
    hiraganaStepOrder=[];
    hiraganaStepSolved=[];
    if(!document.getElementById("slots")) restorePlayArea();
    renderHiraganaAllStep();
    return;
  }

  katakanaAllMode=false;
  hiraganaAllMode=false;

  if(shouldShowHiraganaMatch(key)){
    hiraganaMatchPhase=1;
    hiraganaStepIndex=0;
    hiraganaStepRound=0;
    hiraganaStepOrder=[];
    hiraganaStepSolved=[];
    if(!document.getElementById("slots")) restorePlayArea();
    renderHiraganaMatch();
    return;
  }

  if(shouldShowKatakanaMatch(key)){
    katakanaMatchPhase=1;
    katakanaStepIndex=0;
    katakanaStepOrder=[];
    katakanaStepSolved=[];
    if(!document.getElementById("slots")) restorePlayArea();
    renderKatakanaMatch();
  }else{
    switchStage(key);
  }
}

document.querySelectorAll(".title-stage-btn").forEach(btn=>{
  bindTap(btn,()=>startStage(btn.dataset.stage));
});

bindTap(document.getElementById("titleBtn"),()=>{
  gameScreen.classList.remove("active");
  titleScreen.style.display="flex";
});

bindTap(document.getElementById("backBtn"),()=>{
  if(locked)return;
  if(qIndex>0){
    qIndex--;
    renderQuestion();
  }
});

bindTap(document.getElementById("nextBtn"),()=>{
  if(locked)return;
  goNext();
});

updateStageButtonLabels();

(function(){
  const btn=document.getElementById("titleKanaModeButton");
  if(!btn) return;

  const toggle=()=>{
    const toKatakanaMode = kanaScriptMode==="hiragana";
    kanaScriptMode = toKatakanaMode ? "katakana" : "hiragana";
    btn.textContent = toKatakanaMode ? "カタカナ" : "ひらがな";
    updateStageButtonLabels();
  };

  bindTap(btn,(e)=>{
    e.preventDefault();
    e.stopPropagation();
    toggle();
  });

  btn.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" || e.key===" "){
      e.preventDefault();
      toggle();
    }
  });
})();

(function(){
  const btn=document.getElementById("titleModeButton");
  if(!btn) return;

  const toggle=()=>{
    const toTest = btn.textContent.trim()==="練習";
    btn.textContent = toTest ? "テスト" : "練習";
  };

  bindTap(btn,(e)=>{
    e.preventDefault();
    e.stopPropagation();
    toggle();
  });
  btn.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" || e.key===" "){
      e.preventDefault();
      toggle();
    }
  });
})();
