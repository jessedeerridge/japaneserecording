<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>て形 音声練習</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f4f4f4;color:#111;
  font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif
}
.wrap{width:min(620px,94vw);margin:24px auto 60px}
.card{
  background:#fff;border:1px solid #ddd;border-radius:20px;
  padding:24px;box-shadow:0 5px 18px rgba(0,0,0,.06);text-align:center
}
h1{font-size:23px;margin:0 0 8px}
.sub{font-size:13px;color:#666;margin-bottom:18px}
.problem{
  font-size:54px;font-weight:900;min-height:110px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #222;border-radius:18px;margin-bottom:16px
}
.recordBox{
  min-height:160px;border:3px solid #111;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;transition:background .18s ease,color .18s ease
}
.recordBox.recording{background:#111;color:#fff}
.recordMain{font-size:27px;font-weight:900}
.recordSub{font-size:16px;margin-top:7px}
.meter{
  width:min(300px,84%);height:11px;border:1px solid currentColor;
  border-radius:999px;margin-top:17px;overflow:hidden;display:none
}
.recording .meter{display:block}
.meterFill{
  height:100%;width:0%;
  background:currentColor;
  transition:width .05s linear
}
.result{
  min-height:44px;margin-top:14px;font-size:30px;font-weight:900
}
.ok{color:#087f23}.ng{color:#c62828}
.status{min-height:22px;margin-top:8px;font-size:14px;color:#666}
.debug{
  min-height:18px;margin-top:5px;font-size:11px;color:#999;
  word-break:break-word
}
button{
  border:0;border-radius:13px;padding:14px 20px;
  font-size:17px;font-weight:700;cursor:pointer
}
.primary{background:#111;color:#fff}
button:disabled{opacity:.45}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1>て形 音声練習</h1>
  <div class="sub">問題が出たら、て形を言ってください。</div>

  <div id="problem" class="problem">読み込み中…</div>

  <div id="recordBox" class="recordBox">
    <div id="recordMain" class="recordMain">準備中</div>
    <div id="recordSub" class="recordSub"></div>
    <div class="meter"><div id="meterFill" class="meterFill"></div></div>
  </div>

  <div id="result" class="result"></div>
  <div id="status" class="status"></div>
  <div id="debug" class="debug"></div>

  <button id="startBtn" class="primary hidden">開始</button>
</div>
</div>

<script>
const ITEMS=[
  ["書きます","かいて"],
  ["聞きます","きいて"],
  ["読みます","よんで"],
  ["飲みます","のんで"],
  ["話します","はなして"],
  ["食べます","たべて"],
  ["見ます","みて"],
  ["起きます","おきて"],
  ["寝ます","ねて"],
  ["行きます","いって"],
  ["買います","かって"],
  ["待ちます","まって"],
  ["遊びます","あそんで"],
  ["泳ぎます","およいで"],
  ["します","して"],
  ["来ます","きて"]
];

const $=s=>document.querySelector(s);
const problem=$("#problem");
const recordBox=$("#recordBox");
const recordMain=$("#recordMain");
const recordSub=$("#recordSub");
const meterFill=$("#meterFill");
const result=$("#result");
const statusEl=$("#status");
const debug=$("#debug");
const startBtn=$("#startBtn");

let templates={};
let currentIndex=0;
let stream=null;
let audioCtx=null;
let sourceNode=null;
let recorderNode=null;
let silentGain=null;

let recording=false;
let captureChunks=[];
let captureResolve=null;
let capturePeak=0;

let practiceRunning=false;
let started=false;

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function loadTemplates(){
  const res=await fetch("./voice_templates.json?v="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("voice_templates.json を読み込めません");
  const data=await res.json();
  templates=data.templates || data;
}

function newQuestion(){
  let n;
  do{
    n=Math.floor(Math.random()*ITEMS.length);
  }while(n===currentIndex && ITEMS.length>1);

  currentIndex=n;
  problem.textContent=ITEMS[n][0];
  result.textContent="";
  statusEl.textContent="";
}

async function initAudio(){
  if(stream && stream.active && recorderNode)return;

  stream=await navigator.mediaDevices.getUserMedia({
    audio:{
      channelCount:1
    },
    video:false
  });

  const track=stream.getAudioTracks()[0];
  if(!track)throw new Error("マイクの音声トラックがありません");

  audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  if(audioCtx.state==="suspended"){
    await audioCtx.resume();
  }

  if(!audioCtx.audioWorklet){
    throw new Error("このブラウザではAudioWorkletを使えません");
  }

  const workletCode=`
class RawMicRecorder extends AudioWorkletProcessor{
  constructor(){
    super();
    this.recording=false;
    this.levelCounter=0;

    this.port.onmessage=e=>{
      const d=e.data||{};

      if(d.cmd==="start"){
        this.recording=true;
      }

      if(d.cmd==="stop"){
        this.recording=false;
        this.port.postMessage({type:"done"});
      }
    };
  }

  process(inputs,outputs){
    const input=inputs[0];
    const output=outputs[0];

    if(output){
      for(let c=0;c<output.length;c++){
        output[c].fill(0);
      }
    }

    if(!input || !input[0]){
      return true;
    }

    const ch=input[0];

    let peak=0;
    for(let i=0;i<ch.length;i++){
      const a=Math.abs(ch[i]);
      if(a>peak)peak=a;
    }

    this.levelCounter++;
    if(this.levelCounter>=6){
      this.levelCounter=0;
      this.port.postMessage({type:"level",value:peak});
    }

    if(this.recording){
      const copy=new Float32Array(ch.length);
      copy.set(ch);
      this.port.postMessage(
        {type:"chunk",data:copy},
        [copy.buffer]
      );
    }

    return true;
  }
}

registerProcessor("raw-mic-recorder",RawMicRecorder);
`;

  const blob=new Blob([workletCode],{type:"application/javascript"});
  const url=URL.createObjectURL(blob);

  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  sourceNode=audioCtx.createMediaStreamSource(stream);
  recorderNode=new AudioWorkletNode(audioCtx,"raw-mic-recorder");

  silentGain=audioCtx.createGain();
  silentGain.gain.value=0;

  sourceNode.connect(recorderNode);
  recorderNode.connect(silentGain);
  silentGain.connect(audioCtx.destination);

  recorderNode.port.onmessage=e=>{
    const d=e.data||{};

    if(d.type==="level"){
      const level=Math.max(0,Math.min(1,d.value||0));
      const shown=Math.min(100,Math.round(Math.sqrt(level)*170));
      meterFill.style.width=shown+"%";

      if(recording && level>capturePeak){
        capturePeak=level;
      }
    }

    if(d.type==="chunk" && recording && d.data){
      captureChunks.push(d.data);
    }

    if(d.type==="done"){
      if(captureResolve){
        const r=captureResolve;
        captureResolve=null;
        r();
      }
    }
  };

  const settings=track.getSettings ? track.getSettings() : {};
  debug.textContent=
    `マイク: ${track.label || "使用中"} / `+
    `track=${track.readyState} / `+
    `enabled=${track.enabled} / `+
    `muted=${track.muted} / `+
    `${Math.round(audioCtx.sampleRate)}Hz`;

  track.onmute=()=>{
    debug.textContent="マイクトラックがミュートされました";
  };

  track.onunmute=()=>{
    debug.textContent="マイク入力が復帰しました";
  };
}

function concatFloat32(parts){
  const total=parts.reduce((n,a)=>n+a.length,0);
  const out=new Float32Array(total);
  let p=0;

  for(const a of parts){
    out.set(a,p);
    p+=a.length;
  }

  return out;
}

async function captureRaw(ms=2300){
  if(!recorderNode)throw new Error("録音機能が準備されていません");

  if(audioCtx.state==="suspended"){
    await audioCtx.resume();
  }

  captureChunks=[];
  capturePeak=0;
  meterFill.style.width="0%";

  recording=true;

  recorderNode.port.postMessage({cmd:"start"});

  await sleep(ms);

  const done=new Promise(resolve=>{
    captureResolve=resolve;
  });

  recorderNode.port.postMessage({cmd:"stop"});

  await Promise.race([
    done,
    sleep(500)
  ]);

  recording=false;

  const pcm=concatFloat32(captureChunks);

  if(pcm.length<1000){
    throw new Error(
      `録音データが来ていません。track=${stream?.getAudioTracks?.()[0]?.readyState || "不明"}`
    );
  }

  if(capturePeak<0.00001){
    throw new Error("マイク入力が0です");
  }

  return {
    pcm,
    sampleRate:audioCtx.sampleRate,
    peak:capturePeak
  };
}

function resample(x,from,to){
  if(from===to)return x;

  const len=Math.max(1,Math.round(x.length*to/from));
  const out=new Float32Array(len);

  for(let i=0;i<len;i++){
    const p=i*from/to;
    const a=Math.floor(p);
    const b=Math.min(x.length-1,a+1);
    const t=p-a;

    out[i]=x[a]*(1-t)+x[b]*t;
  }

  return out;
}

function trimVoice(x){
  let peak=0;
  for(const v of x){
    const a=Math.abs(v);
    if(a>peak)peak=a;
  }

  if(peak<=0)return x;

  const windowSize=320;
  const threshold=Math.max(peak*.035,0.0002);

  const rmsAt=p=>{
    let s=0,n=0;

    for(let i=p;i<Math.min(x.length,p+windowSize);i++){
      s+=x[i]*x[i];
      n++;
    }

    return Math.sqrt(s/Math.max(1,n));
  };

  let start=-1;
  let end=-1;

  for(let p=0;p<x.length-windowSize;p+=160){
    if(rmsAt(p)>threshold){
      start=Math.max(0,p-1000);
      break;
    }
  }

  for(let p=x.length-windowSize;p>0;p-=160){
    if(rmsAt(p)>threshold){
      end=Math.min(x.length,p+windowSize+1000);
      break;
    }
  }

  if(start<0 || end<0 || end<=start){
    return x;
  }

  return x.slice(start,end);
}

function fingerprint(x){
  x=trimVoice(x);

  if(x.length<800){
    throw new Error("録音が短すぎます");
  }

  const F=28;
  const B=18;
  const N=256;
  const out=[];

  for(let f=0;f<F;f++){
    const st=Math.max(
      0,
      Math.min(
        Math.max(0,x.length-N-1),
        Math.floor((f+.5)/F*x.length-N/2)
      )
    );

    const row=[];

    for(let b=0;b<B;b++){
      const fr=180*Math.pow(4200/180,b/(B-1));
      const w=2*Math.PI*fr/16000;

      let re=0;
      let im=0;

      for(let n=0;n<N;n++){
        const win=.5-.5*Math.cos(2*Math.PI*n/(N-1));
        const v=(x[st+n]||0)*win;

        re+=v*Math.cos(w*n);
        im-=v*Math.sin(w*n);
      }

      row.push(Math.log(1e-7+re*re+im*im));
    }

    const mean=row.reduce((a,b)=>a+b,0)/B;
    let ss=0;

    for(let b=0;b<B;b++){
      row[b]-=mean;
      ss+=row[b]*row[b];
    }

    const sd=Math.sqrt(ss/B)||1;

    for(let b=0;b<B;b++){
      row[b]/=sd;
    }

    out.push(row);
  }

  return out;
}

function frameDist(a,b){
  let s=0;

  for(let i=0;i<a.length;i++){
    const d=a[i]-b[i];
    s+=d*d;
  }

  return Math.sqrt(s/a.length);
}

function dtw(A,B){
  const n=A.length;
  const m=B.length;

  const prev=new Float64Array(m+1);
  prev.fill(Infinity);
  prev[0]=0;

  for(let i=1;i<=n;i++){
    const cur=new Float64Array(m+1);
    cur.fill(Infinity);

    for(let j=1;j<=m;j++){
      const cost=frameDist(A[i-1],B[j-1]);

      cur[j]=cost+Math.min(
        cur[j-1],
        prev[j],
        prev[j-1]
      );
    }

    prev.set(cur);
  }

  return prev[m]/(n+m);
}

function nearestClass(feat){
  const classes=[];

  for(const [key,refs] of Object.entries(templates)){
    if(!Array.isArray(refs) || !refs.length)continue;

    let best=Infinity;

    for(const ref of refs){
      try{
        best=Math.min(best,dtw(feat,ref));
      }catch{}
    }

    classes.push({key,dist:best});
  }

  classes.sort((a,b)=>a.dist-b.dist);

  return classes[0] || null;
}

async function attempt(){
  const target=ITEMS[currentIndex][1];

  result.textContent="";
  statusEl.textContent="";
  recordMain.textContent="";
  recordSub.textContent="";

  // 問題を見てから発話準備
  await sleep(650);

  recordBox.classList.add("recording");
  recordMain.textContent="録音中";
  recordSub.textContent="いま言ってください";

  const raw=await captureRaw(2300);

  recordBox.classList.remove("recording");
  recordMain.textContent="";
  recordSub.textContent="";
  meterFill.style.width="0%";

  const pcm16=resample(raw.pcm,raw.sampleRate,16000);
  const feat=fingerprint(pcm16);
  const best=nearestClass(feat);

  if(!best){
    throw new Error("正解データがありません");
  }

  debug.textContent=
    `録音OK / peak=${raw.peak.toFixed(4)} / `+
    `samples=${raw.pcm.length} / 最接近=${best.key}`;

  const correct=best.key===target;

  if(correct){
    result.textContent="○";
    result.className="result ok";

    await sleep(600);
    newQuestion();
    return;
  }

  result.textContent="×";
  result.className="result ng";
  statusEl.textContent=`いちばん近い音：${best.key}`;

  await sleep(850);
}

async function practiceLoop(){
  if(practiceRunning)return;

  practiceRunning=true;

  try{
    while(started){
      try{
        await attempt();
      }catch(e){
        console.error(e);

        recordBox.classList.remove("recording");
        meterFill.style.width="0%";
        recordMain.textContent="もう一度";
        recordSub.textContent="";
        statusEl.textContent=e.message||String(e);

        await sleep(900);
      }
    }
  }finally{
    practiceRunning=false;
  }
}

startBtn.onclick=async()=>{
  if(started)return;

  try{
    startBtn.disabled=true;
    startBtn.textContent="マイク準備中…";

    await initAudio();

    started=true;
    startBtn.classList.add("hidden");

    newQuestion();

    await sleep(500);
    practiceLoop();

  }catch(e){
    console.error(e);

    startBtn.disabled=false;
    startBtn.textContent="開始";

    statusEl.textContent=e.message||String(e);
  }
};

(async()=>{
  try{
    problem.textContent="正解データ読込中…";

    await loadTemplates();

    problem.textContent="準備OK";
    recordMain.textContent="開始を押してください";
    recordSub.textContent="最初だけマイクを許可します";

    startBtn.classList.remove("hidden");

  }catch(e){
    console.error(e);

    problem.textContent="データエラー";
    recordMain.textContent="";
    recordSub.textContent="";

    statusEl.textContent=
      "voice_templates.json を index.html と同じ場所に置いてください";
  }
})();
</script>
</body>
</html>
